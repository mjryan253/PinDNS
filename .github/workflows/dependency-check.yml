name: Dependency Check

on:
  # Docs-only changes cannot alter the dependency classpath, so skip them
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/FUNDING.yml']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/FUNDING.yml']
  schedule:
    # Weekly (Monday 06:00 UTC): new CVEs appear against unchanged dependencies
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Unique key per run + prefix restore: every run saves the freshly updated NVD database
      - name: Restore NVD database cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      # Fails on CVSS >= 7.0 (see dependencyCheck block in app/build.gradle.kts).
      # NVD_API_KEY is optional but keyless runs are heavily rate-limited by the NVD API.
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew :app:dependencyCheckAnalyze

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: builds/app/reports/dependency-check/

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: builds/app/reports/dependency-check/dependency-check-report.sarif
          category: dependency-check
